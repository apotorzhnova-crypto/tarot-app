        <!-- ЭКРАН 2: СХЕМА РАСКЛАДА -->
        <div id="screen-schema" class="screen">

            <button class="btn" onclick="startScanning()">Включить камеру и сканировать</button>
            <button class="btn btn-secondary" onclick="goHome()">Назад к выбору</button>
        </div>

        <!-- ЭКРАН 3: СКАНЕР КАМЕРЫ -->
        <div id="screen-scanner" class="screen">
            <div class="scanner-status" id="scanner-instruction">Наведите камеру на карту...</div>
            
            <div id="reader"></div>

            <div id="scan-next-container" style="display: none;">

                <button class="btn" id="btn-next-card" onclick="prepareNextCard()">

            </div>

            <button class="btn btn-secondary" style="margin-top: 15px;" onclick="stopScanningAndBack()">Отмена</button>
        </div>

        <!-- ЭКРАН 4: РЕЗУЛЬТАТЫ -->
        <div id="screen-results" class="screen">

            <button class="btn" onclick="goHome()">Новый расклад</button>

        "WANDS_04": { name: "4 Жезлов", meaning: "Праздник, уют, радость, стабильность, новоселье.", description: "Счастливое завершение важного этапа. Празднование с близкими, стабильный дом и внутренний покой.", image: "WANDS_04.png", aliases: ["WANDS_4", "4_OF_WANDS", "ЧЕТВЕРКА_ЖЕЗЛОВ"] },
        "WANDS_05": { name: "5 Жезлов", meaning: "Конкуренция, споры, здоровое соперничество, испытание.", description: "Столкновение интересов и мнений. Не агрессивный конфликт, а возможность отстоять свои позиции.", image: "WANDS_05.png", aliases: ["WANDS_5", "5_OF_WANDS", "ПЯТЕРКА_ЖЕЗЛОВ"] },
        "WANDS_06": { name: "6 Жезлов", meaning: "Триумф, признание, победа, хорошие новости.", description: "Публичный успех и признание ваших заслуг. Период гордости за достигнутые результаты.", image: "WANDS_06.png", aliases: ["WANDS_6", "6_OF_WANDS", "ШЕСТЕРКА_ЖЕЗЛОВ"] },
        "WANDS_07": { name: "7 Жезлов", meaning: "Защита позиций, стойкость, отстаивание прав.", description: "Вам приходится защищать свои успехи от критиков или конкурентов. Проявите твердость — победа за вами.", image: "WANDS_07.png", aliases: ["WANDS_7", "7_OF_WANDS", "СЕМЕРКА_ЖЕЗЛОВ"] },
        "WANDS_08": { name: "8 Жезлов", meaning: "Быстрые события, известия, поездки, стремительный прогресс.", description: "События развиваются стремительно. Ожидайте важных новостей, сообщений или быстрой поездки.", image: "WANDS_08.png", aliases: ["WANDS_8", "8_OF_WANDS", "ВОСЬМЕРКА_ЖЕЗЛОВ"] },
        "WANDS_09": { name: "9 Жезлов", meaning: "Осторожность, настороженность, готовность к обороне.", description: "Опыт прошлых ошибок заставляет быть начеку. Вы устали, но у вас достаточно сил довести дело до конца.", image: "WANDS_09.png", aliases: ["WANDS_9", "9_OF_WANDS", "ДЕВЯТКА_ЖЕЗЛОВ"] },
        "WANDS_10": { name: "10 Жезлов", meaning: "Перегрузка, тяжкий груз, ответственность, усталость.", description: "Вы взяли на себя слишком много обязательств. Пора делегировать задачи и сбросить лишнее бремя.", image: "WANDS_10.png", aliases: ["10_OF_WANDS", "DESYATKA_ZHEZLOV", "ДЕСЯТКА_ЖЕЗЛОВ"] },
        "WANDS_PAGE": { name: "Паж Жезлов", meaning: "Энтузиазм, известие, любопытство, новое увлечение.", description: "Молодой человек или приход хороших новостей. Желание учиться новому и исследовать возможности.", image: "WANDS_PAGE.png", aliases: ["PAGE_OF_WANDS", "ПАЖ_ЖЕЗЛОВ"] },
        "WANDS_KNIGHT": { name: "Рыцарь Жезлов", meaning: "Движение, импульсивность, азарт, смелые шаги.", description: "Энергичные действия, драйв и авантюризм. Карта советует действовать смело, но избегать спешки.", image: "WANDS_KNIGHT.png", aliases: ["KNIGHT_OF_WANDS", "РЫЦАРЬ_ЖЕЗЛОВ"] },
        "WANDS_QUEEN": { name: "Королева Жезлов", meaning: "Харизма, уверенность, независимость, вдохновение.", description: "Яркая, энергичная и уверенная в себе женщина. Умение вести за собой и создавать тепло вокруг.", image: "WANDS_QUEEN.png", aliases: ["QUEEN_OF_WANDS", "КОРОЛЕВА_ЖЕЗЛОВ"] },
        "WANDS_KING": { name: "Король Жезлов", meaning: "Лидерство, авторитет, предпринимательский дух.", description: "Опытный, амбициозный лидер. Карта советует проявлять решительность, масштабное мышление и ответственность.", image: "WANDS_KING.png", aliases: ["KING_OF_WANDS", "КОРОЛЬ_ЖЕЗЛОВ"] },

        // === КУБКИ (CUPS) ===

        "CUPS_02": { name: "2 Кубков", meaning: "Взаимность, симпатия, партнерство, гармония.", description: "Гармоничный союз двух сердец. Взаимопонимание в любви, дружбе или деловом сотрудничестве.", image: "CUPS_02.png", aliases: ["CUPS_2", "2_OF_CUPS", "ДВОЙКА_КУБКОВ"] },
        "CUPS_03": { name: "3 Кубков", meaning: "Праздник, дружба, совместная радость, поддержка.", description: "Радостная встреча с друзьями, празднование успеха в кругу единомышленников.", image: "CUPS_03.png", aliases: ["CUPS_3", "3_OF_CUPS", "ТРОЙКА_КУБКОВ"] },
        "CUPS_04": { name: "4 Кубков", meaning: "Апатия, упущенные шансы, недовольство, скука.", description: "Состояние эмоционального выгорания и скуки. Вы не замечаете ценных возможностей рядом.", image: "CUPS_04.png", aliases: ["CUPS_4", "4_OF_CUPS", "ЧЕТВЕРКА_КУБКОВ"] },
        "CUPS_05": { name: "5 Кубков", meaning: "Печаль, сожаление об упущенном, фокус на негативе.", description: "Огорчение из-за потерь. Карта напоминает: не всё потеряно, обратите внимание на то, что осталось.", image: "CUPS_05.png", aliases: ["CUPS_5", "5_OF_CUPS", "ПЯТЕРКА_КУБКОВ"] },
        "CUPS_06": { name: "6 Кубков", meaning: "Воспоминания, ностальгия, встреча из прошлого, детство.", description: "Теплые воспоминания, возвращение давних знакомых или проявление искренней детской доброты.", image: "CUPS_06.png", aliases: ["CUPS_6", "6_OF_CUPS", "ШЕСТЕРКА_КУБКОВ"] },
        "CUPS_07": { name: "7 Кубков", meaning: "Иллюзии, мечты, соблазны, сложность выбора.", description: "Множество вариантов и фантазий, но не все из них реальны. Остерегайтесь иллюзий и витания в облаках.", image: "CUPS_07.png", aliases: ["CUPS_7", "7_OF_CUPS", "СЕМЕРКА_КУБКОВ"] },
        "CUPS_08": { name: "8 Кубков", meaning: "Уход от прошлого, поиск высшего смысла, перемены.", description: "Осознанное решение оставить то, что больше не приносит радости, и отправиться на поиски своего пути.", image: "CUPS_08.png", aliases: ["CUPS_8", "8_OF_CUPS", "ВОСЬМЕРКА_КУБКОВ"] },
        "CUPS_09": { name: "9 Кубков", meaning: "Удовлетворение, исполнение желаний, комфорт.", description: "«Карта исполнения желаний». Эмоциональное сытость, удовольствие от жизни и праздничный настрой.", image: "CUPS_09.png", aliases: ["CUPS_9", "9_OF_CUPS", "ДЕВЯТКА_КУБКОВ"] },
        "CUPS_10": { name: "10 Кубков", meaning: "Семейное счастье, любовь, полная гармония, дом.", description: "Высшая степень эмоционального счастья. Любовь в семье, единство близких и душевный покой.", image: "CUPS_10.png", aliases: ["10_OF_CUPS", "ДЕСЯТКА_КУБКОВ"] },
        "CUPS_PAGE": { name: "Паж Кубков", meaning: "Трогательное послание, романтика, творческий порыв.", description: "Приятное эмоциональное известие, зарождающаяся симпатия или вдохновляющий творческий импульс.", image: "CUPS_PAGE.png", aliases: ["PAGE_OF_CUPS", "ПАЖ_КУБКОВ"] },
        "CUPS_KNIGHT": { name: "Рыцарь Кубков", meaning: "Романтика, признание в чувствах, предложение.", description: "Прибытие романтического предложения или человека, несущего любовь, гармонию и заботу.", image: "CUPS_KNIGHT.png", aliases: ["KNIGHT_OF_CUPS", "РЫЦАРЬ_КУБКОВ"] },
        "CUPS_QUEEN": { name: "Королева Кубков", meaning: "Эмпатия, мягкость, забота, развитая интуиция.", description: "Чуткая, любящая женщина. Умение слушать, сопереживать и дарить душевное тепло.", image: "CUPS_QUEEN.png", aliases: ["QUEEN_OF_CUPS", "КОРОЛЕВА_КУБКОВ"] },
        "CUPS_KING": { name: "Король Кубков", meaning: "Эмоциональная зрелость, мудрость, поддержка.", description: "Человек, умеющий контролировать свои эмоции и давать глубокие душевные советы.", image: "CUPS_KING.png", aliases: ["KING_OF_CUPS", "КОРОЛЬ_КУБКОВ"] },

        // === МЕЧИ (SWORDS) ===

        "SWORDS_02": { name: "2 Мечей", meaning: "Замкнутость, сомнения, компромисс, закрытые глаза.", description: "Нежелание видеть правду или принимать сложное решение. Временное равновесие сил.", image: "SWORDS_02.png", aliases: ["SWORDS_2", "2_OF_SWORDS", "ДВОЙКА_МЕЧЕЙ"] },
        "SWORDS_03": { name: "3 Мечей", meaning: "Боль, разбитое сердце, разочарование, печальная правда.", description: "Эмоциональная боль или болезненное осознание истины. Освобождение через слезы.", image: "SWORDS_03.png", aliases: ["SWORDS_3", "3_OF_SWORDS", "ТРОЙКА_МЕЧЕЙ"] },

        "SWORDS_05": { name: "5 Мечей", meaning: "Пиррова победа, конфликт, поражение, напряжение.", description: "Конфликт, в котором победа достается слишком дорогой ценой. Избегайте бессмысленных споров.", image: "SWORDS_05.png", aliases: ["SWORDS_5", "5_OF_SWORDS", "ПЯТЕРКА_МЕЧЕЙ"] },
        "SWORDS_06": { name: "6 Мечей", meaning: "Переход, путь к лучшему, уход от проблем.", description: "Оставление трудностей позади. Переезд, путешествие или постепенный выходя из кризиса.", image: "SWORDS_06.png", aliases: ["SWORDS_6", "6_OF_SWORDS", "ШЕСТЕРКА_МЕЧЕЙ"] },
        "SWORDS_07": { name: "7 Мечей", meaning: "Хитрость, утаивание, обходные пути, стратегии.", description: "Необходимость действовать гибко или предостережение от обмана и недоговоренностей.", image: "SWORDS_07.png", aliases: ["SWORDS_7", "7_OF_SWORDS", "СЕМЕРКА_МЕЧЕЙ"] },
        "SWORDS_08": { name: "8 Мечей", meaning: "Ограничения, самоограничение, чувство тупика.", description: "Ограничения находятся скорее в вашей голове, чем в реальности. Снимите повязку с глаз.", image: "SWORDS_08.png", aliases: ["SWORDS_8", "8_OF_SWORDS", "ВОСЬМЕРКА_МЕЧЕЙ"] },
        "SWORDS_09": { name: "9 Мечей", meaning: "Тревога, бессонница, страхи, переживания.", description: "Ночные тревоги и накручивание себя. Большинство ваших страхов не воплотится в реальности.", image: "SWORDS_09.png", aliases: ["SWORDS_9", "9_OF_SWORDS", "ДЕВЯТКА_МЕЧЕЙ"] },
        "SWORDS_10": { name: "10 Мечей", meaning: "Окончательный финал, дно кризиса, рассвет близко.", description: "Завершение самого сложного периода. Хуже уже не будет — впереди только обновление.", image: "SWORDS_10.png", aliases: ["10_OF_SWORDS", "ДЕСЯТКА_МЕЧЕЙ"] },
        "SWORDS_PAGE": { name: "Паж Мечей", meaning: "Сбор информации, наблюдение, критичность.", description: "Любопытство, поиск фактов, иногда мелочная критика. Время проявить бдительность.", image: "SWORDS_PAGE.png", aliases: ["PAGE_OF_SWORDS", "ПАЖ_МЕЧЕЙ"] },
        "SWORDS_KNIGHT": { name: "Рыцарь Мечей", meaning: "Резкость, стремительная атака, споры, решительность.", description: "Стремительные действия, прямой разговор. Карта советует действовать быстро, но сдержанно.", image: "SWORDS_KNIGHT.png", aliases: ["KNIGHT_OF_SWORDS", "РЫЦАРЬ_МЕЧЕЙ"] },
        "SWORDS_QUEEN": { name: "Королева Мечей", meaning: "Проницательность, независимость, логика, честность.", description: "Умная, независимая женщина. Умение отсекать эмоции ради сухой истины и справедливости.", image: "SWORDS_QUEEN.png", aliases: ["QUEEN_OF_SWORDS", "КОРОЛЕВА_МЕЧЕЙ"] },
        "SWORDS_KING": { name: "Король Мечей", meaning: "Аналитический ум, авторитет, объективность.", description: "Профессионал, опирающийся на факты и закон. Принятие решений с холодной головой.", image: "SWORDS_KING.png", aliases: ["KING_OF_SWORDS", "КОРОЛЬ_МЕЧЕЙ"] },

        "PENTACLES_08": { name: "8 Пентаклей", meaning: "Трудолюбие, мастерство, оттачивание навыков, рутина.", description: "Усердный труд над любимым делом. Качественное выполнение работы приведет к высоким доходам.", image: "PENTACLES_08.png", aliases: ["PENTACLES_8", "8_OF_PENTACLES", "ВОСЬМЕРКА_ПЕНТАКЛЕЙ"] },
        "PENTACLES_09": { name: "9 Пентаклей", meaning: "Материальная независимость, достаток, наслаждение.", description: "Финансовый комфорт, ухоженность и удовольствие от плодов собственных трудов.", image: "PENTACLES_09.png", aliases: ["PENTACLES_9", "9_OF_PENTACLES", "ДЕВЯТКА_ПЕНТАКЛЕЙ"] },

        "PENTACLES_KING": { name: "Король Пентаклей", meaning: "Финансовый успех, предприимчивость, стабильность.", description: "Опытный бизнесмен или покровитель. Символ устойчивого материального положения.", image: "PENTACLES_KING.png", aliases: ["KING_OF_PENTACLES", "КОРОЛЬ_ПЕНТАКЛЕЙ"] }
    };

    // 2. УМНАЯ ФУНКЦИЯ ПОИСКА С УЧЕТОМ АЛИАСОВ
    function findCardData(scannedCode) {
        if (!scannedCode) return null;
        
        const raw = scannedCode.trim().toUpperCase();
        const clean = raw.replace(/[^A-Z0-9_]/g, '');

        // 1. Точное совпадение с ключом
        if (tarotDatabase[raw]) return tarotDatabase[raw];
        if (tarotDatabase[clean]) return tarotDatabase[clean];

        // 2. Поиск по алиасам (альтернативным названиям)
        for (let key in tarotDatabase) {
            const card = tarotDatabase[key];
            if (card.aliases) {
                for (let alias of card.aliases) {
                    if (raw === alias || clean === alias || raw.includes(alias) || alias.includes(raw)) {
                        return card;
                    }
                }
            }
        }

        // 3. Поиск по вхождению масти и номера (например, WANDS_1 -> WANDS_01)
        const suits = ['WANDS', 'CUPS', 'SWORDS', 'PENTACLES'];
        for (let suit of suits) {
            if (raw.includes(suit)) {
                for (let i = 1; i <= 10; i++) {
                    const numStr = i < 10 ? '0' + i : '' + i;
                    if (raw.includes('_' + i) || raw.includes('_' + numStr) || raw.endsWith(i) || raw.endsWith(numStr)) {
                        const targetKey = suit + '_' + numStr;
                        if (tarotDatabase[targetKey]) return tarotDatabase[targetKey];
                    }
                }
                if (raw.includes('PAGE') || raw.includes('PAZH')) return tarotDatabase[suit + '_PAGE'];
                if (raw.includes('KNIGHT') || raw.includes('RYTSAR')) return tarotDatabase[suit + '_KNIGHT'];
                if (raw.includes('QUEEN') || raw.includes('KOROLEVA')) return tarotDatabase[suit + '_QUEEN'];
                if (raw.includes('KING') || raw.includes('KOROL')) return tarotDatabase[suit + '_KING'];
            }
        }

        return null;
    }

    let currentSpread = null;
    let currentStep = 0;
    let scannedCards = [];
    let html5QrCode = null;
    let isWaitingForNext = false;

    function renderHome() {
        const listEl = document.getElementById('spreads-list');
        listEl.innerHTML = '';
        spreads.forEach(spread => {
            const card = document.createElement('div');
            card.className = 'spread-card';
            card.innerHTML = `<h3>${spread.name} (${spread.count} карт)</h3><p>${spread.desc}</p>`;
            card.onclick = () => selectSpread(spread);
            listEl.appendChild(card);
        });
    }

    function selectSpread(spread) {
        currentSpread = spread;
        currentStep = 0;
        scannedCards = [];

        document.getElementById('schema-title').innerText = spread.name;
        document.getElementById('schema-about-text').innerText = spread.about;
        
        const imgEl = document.getElementById('schema-image');
        if (spread.schemaImage && spread.schemaImage.trim() !== "") {
            imgEl.src = spread.schemaImage;
            imgEl.style.display = 'block';
        } else {
            imgEl.style.display = 'none';
        }

        let posText = "<b>Значение позиций карт:</b><br>";
        spread.positions.forEach((pos) => {
            posText += `• ${pos}<br>`;
        });
        document.getElementById('schema-positions-text').innerHTML = posText;

        switchScreen('screen-schema');
    }

    function startScanning() {
        switchScreen('screen-scanner');
        document.getElementById('scan-next-container').style.display = 'none';
        isWaitingForNext = false;
        
        html5QrCode = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: { width: 220, height: 220 } };
        
        updateScannerInstruction();

        html5QrCode.start(
            { facingMode: "environment" }, 
            config, 
            onScanSuccess, 
            onScanFailure
        ).catch(err => {
            alert("Не удалось запустить камеру. Убедитесь, что разрешили доступ к ней.");
            goHome();
        });
    }

    function updateScannerInstruction() {
        const posName = currentSpread.positions[currentStep];
        document.getElementById('scanner-instruction').innerHTML = 
            `Сканируйте карту [${currentStep + 1} из ${currentSpread.count}]<br><span style="color:#fff; font-size:14px;">Позиция: "${posName}"</span>`;
    }

    function onScanSuccess(decodedText, decodedResult) {
        if (isWaitingForNext) return;

        isWaitingForNext = true;

        let cardData = findCardData(decodedText);

        if (!cardData) {
            cardData = { 
                name: decodedText, 
                meaning: "Распознанная карта", 
                description: "Описание для этой карты подтянуто из базы.",
                image: "logotaro.png"
            };
        }

        scannedCards.push({
            position: currentSpread.positions[currentStep],
            card: cardData
        });

        if (navigator.vibrate) navigator.vibrate(100);

        if (html5QrCode) {
            html5QrCode.pause(true);
        }

        document.getElementById('scanned-card-info').innerText = `Считана карта: ${cardData.name}`;
        
        const nextBtn = document.getElementById('btn-next-card');
        if (currentStep + 1 >= currentSpread.count) {
            nextBtn.innerText = "Посмотреть результаты расклада";
        } else {
            nextBtn.innerText = `Сканировать следующую карту (${currentStep + 2}/${currentSpread.count})`;
        }

        document.getElementById('scan-next-container').style.display = 'block';
    }

    function prepareNextCard() {
        currentStep++;
        document.getElementById('scan-next-container').style.display = 'none';

        if (currentStep >= currentSpread.count) {
            stopCameraAndShowResults();
        } else {
            isWaitingForNext = false;
            updateScannerInstruction();
            if (html5QrCode) {
                html5QrCode.resume();
            }
        }
    }

    function onScanFailure(error) {
        // Игнорируем кадры без QR
    }

    function stopCameraAndShowResults() {
        if (html5QrCode) {
            html5QrCode.stop().then(() => {
                showResults();
            }).catch(() => {
                showResults();
            });
        } else {
            showResults();
        }
    }

    function stopScanningAndBack() {
        if (html5QrCode) {
            html5QrCode.stop().finally(() => {
                goHome();
            });
        } else {
            goHome();
        }
    }

    function showResults() {
        const container = document.getElementById('results-container');
        container.innerHTML = '';

        scannedCards.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'result-item';
            
            const cardImgSrc = item.card.image ? item.card.image : 'logotaro.png';

            div.innerHTML = `
                <img src="${cardImgSrc}" alt="${item.card.name}" class="result-thumb" onerror="this.src='logotaro.png'">
                <div class="result-content">
                    <h4>Позиция ${idx + 1}: ${item.position}</h4>
                    <div class="result-card-name">${item.card.name}</div>
                    <div class="result-meaning">Ключ: ${item.card.meaning}</div>
                    <div class="result-description">${item.card.description}</div>
                </div>
            `;
            container.appendChild(div);
        });

        switchScreen('screen-results');
    }

    function switchScreen(screenId) {
        document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function goHome() {
        if (html5QrCode && html5QrCode.isScanning) {
            html5QrCode.stop().catch(() => {});
        }
        switchScreen('screen-home');
    }

    renderHome();
</script>
